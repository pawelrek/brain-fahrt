name: slop
description: "brain-fahrt (BF) — voice-first, fully-offline todo capture"
publish_to: 'none'
version: 0.1.15+62

environment:
  sdk: ^3.12.1

dependencies:
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  fllama: ^0.0.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^8.1.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.5
  record: ^7.0.0
  shared_preferences: ^2.3.0
  sherpa_onnx: ^1.13.2
  # Model downloader (Play size fix v0.1.15): resumable HTTP + integrity + net type.
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

dependency_overrides:
  # vendored + patched fllama: proguard-android.txt -> -optimize.txt for new AGP
  fllama:
    path: third_party/fllama

# Launcher icon = the red recording dot. #F23B2F == brandRed (DotReds.defaultRed).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/slop_icon.png"
  adaptive_icon_background: "#F23B2F"
  adaptive_icon_foreground: "assets/icon/slop_icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
